<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gateway OPC DA-UA — Diagnóstico</title>
<style>
  :root { --ok:#2e9e5b; --warn:#c98a12; --bad:#c0392b; --idle:#7a7a7a; --line:#dcdcdc; }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; font:15px/1.5 "Segoe UI",system-ui,sans-serif;
         color:#1e1e1e; background:#f6f6f6; }
  header { display:flex; align-items:baseline; gap:16px; margin-bottom:20px; }
  h1 { font-size:19px; margin:0; font-weight:600; }
  .stamp { color:#666; font-size:13px; font-variant-numeric:tabular-nums; }
  nav { display:flex; gap:8px; margin-bottom:20px; }
  nav button { padding:7px 16px; border:1px solid var(--line); background:#fff;
               border-radius:4px; cursor:pointer; font-size:14px; }
  nav button.active { background:#1e1e1e; color:#fff; border-color:#1e1e1e; }
  .card { background:#fff; border:1px solid var(--line); border-radius:6px;
          padding:20px; margin-bottom:16px; }
  .light { display:flex; align-items:center; gap:14px; }
  .dot { width:22px; height:22px; border-radius:50%; background:var(--idle); flex:none; }
  .dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); }
  .dot.bad { background:var(--bad); } .dot.idle { background:var(--idle); }
  .state { font-size:22px; font-weight:600; }
  .verdict { margin:14px 0 0; }
  .verdict .num { font-variant-numeric:tabular-nums; font-weight:600; }
  .hint { margin:8px 0 0; color:#555; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .metric .k { font-size:12px; color:#666; text-transform:uppercase; letter-spacing:.04em; }
  .metric .v { font-size:19px; font-variant-numeric:tabular-nums; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.04em;
       color:#666; margin:0 0 14px; font-weight:600; }
  .hidden { display:none; }
</style>
</head>
<body>

<header>
  <h1>Gateway OPC DA → UA</h1>
  <span class="stamp" id="stamp">—</span>
</header>

<nav>
  <button id="tab-op" class="active">Operador</button>
  <button id="tab-det">Detalle</button>
</nav>

<section id="view-op">
  <div class="card">
    <div class="light">
      <span class="dot idle" id="dot"></span>
      <span class="state" id="linkState">Conectando…</span>
    </div>
    <p class="verdict" id="verdict">Esperando el primer ciclo del gateway.</p>
    <p class="hint" id="hint"></p>
  </div>

  <div class="card">
    <h2>Tags</h2>
    <div class="grid" id="tagCounters"></div>
  </div>

  <div class="card">
    <h2>Adquisición</h2>
    <div class="grid" id="perfCounters"></div>
  </div>
</section>

<section id="view-det" class="hidden">
  <div class="card"><p class="hint">Pendiente: tabla de tags degradados.</p></div>
</section>

<script>
// Cada diagnostico se traduce a una frase con los contadores que lo generaron
// al lado: un nombre de enum solo no le dice nada a quien mira la pantalla, y
// un numero sin su interpretacion tampoco. La segunda linea, cuando existe, es
// que hacer al respecto.
function verdict(d, c, s) {
  const n = c.silentNeverAnswered, p = c.silentPreviouslyAnswered, t = c.totalConfigured;
  switch (d) {
    case "Healthy":
      return [`Los <span class="num">${c.good}</span> de <span class="num">${t}</span> tags configurados responden con calidad buena.`, ""];
    case "DaLinkDown":
      return [`Sin vínculo con el servidor DA. Reintentos: <span class="num">${s.reconnectAttempts}</span>.`,
              s.lastError ? `Último error: ${s.lastError}` : "Verificá que el servidor DA esté corriendo."];
    case "DaServerStalled":
      return [`El vínculo está abierto pero el ciclo no vuelve hace <span class="num">${s.secondsSinceLastCycle.toFixed(0)}</span> s.`,
              "El servidor DA no murió: dejó de contestar. Suele requerir reiniciarlo."];
    case "LikelyCsvMismatch":
      return [`<span class="num">${n}</span> de <span class="num">${t}</span> tags nunca entregaron un dato desde que arrancó el gateway.`,
              "Esos ItemIDs no existen del otro lado: revisá el CSV de mapeo o que el servidor DA tenga su configuración cargada. Desde adentro del gateway las dos causas son indistinguibles."];
    case "DaServerRepopulatedEmpty":
      return [`<span class="num">${p}</span> tags que antes respondían dejaron de hacerlo.`,
              "El servidor DA sigue en pie pero perdió sus items: el caso del simulador relanzado sin su configuración."];
    case "PartialDegradation":
      return [`<span class="num">${c.silentTotal}</span> de <span class="num">${t}</span> tags mudos; el resto responde bien.`,
              "Son una minoría: no hay una causa global. Mirá cuáles en la vista Detalle."];
    case "Indeterminate":
      return [`<span class="num">${n}</span> nunca respondieron y <span class="num">${p}</span> dejaron de responder.`,
              "Están pasando dos cosas a la vez; el gateway no elige una por vos."];
    default:
      return [d, ""];
  }
}

// El color lo manda el vinculo, pero un diagnostico no-sano lo baja a ambar:
// COM sano con la mitad de los tags mudos no es verde para quien opera.
function color(link, diag) {
  if (link === "Disconnected") return "bad";
  if (link === "Stalled" || link === "Reconnecting") return "warn";
  return diag === "Healthy" ? "ok" : "warn";
}

const LINK_ES = { Connected:"Conectado", Disconnected:"Desconectado",
                  Reconnecting:"Reconectando", Stalled:"Sin respuesta" };

function cells(el, pairs) {
  el.innerHTML = pairs.map(([k, v]) =>
    `<div class="metric"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
}

function paint(s) {
  const [main, hint] = verdict(s.diagnosis, s.counters, s.status);
  document.getElementById("dot").className = "dot " + color(s.status.linkState, s.diagnosis);
  document.getElementById("linkState").textContent = LINK_ES[s.status.linkState] ?? s.status.linkState;
  document.getElementById("verdict").innerHTML = main;
  document.getElementById("hint").textContent = hint;
  document.getElementById("stamp").textContent =
    `foto ${new Date(s.takenUtc).toLocaleTimeString("es-AR", { hour12: false })} · ciclo hace ${s.status.secondsSinceLastCycle.toFixed(1)} s · en pie ${Math.floor(s.status.uptimeSeconds / 60)} min`;

  const c = s.counters;
  cells(document.getElementById("tagCounters"), [
    ["Configurados", c.totalConfigured], ["Good", c.good],
    ["Uncertain", c.uncertain], ["Bad", c.bad],
    ["Nunca respondieron", c.silentNeverAnswered],
    ["Dejaron de responder", c.silentPreviouslyAnswered]
  ]);

  const p = s.performance;
  // workingSetMb llega con la cola binaria del calculo: se recorta al mostrar,
  // no en el dato, para que el JSON siga siendo el numero sin redondear.
  cells(document.getElementById("perfCounters"), [
    ["Ciclos", c.readCycles], ["Fallos de lectura", c.readFailures],
    ["Último ciclo", p.lastCycleMs.toFixed(1) + " ms"],
    ["Promedio", p.avgCycleMs.toFixed(1) + " ms"],
    ["Máximo", p.maxCycleMs.toFixed(1) + " ms"],
    ["Intervalo", p.configuredIntervalMs + " ms"],
    ["Sesiones UA", p.connectedUaSessions],
    ["Monitored items", p.monitoredItems],
    ["Memoria", p.workingSetMb.toFixed(1) + " MB"]
  ]);
}

// Tres estados distintos y no dos: "todavia no hay dato" (503) no es lo mismo
// que "no llego la respuesta" (el gateway se cayo o la pagina quedo abierta).
function waiting(text) {
  document.getElementById("dot").className = "dot idle";
  document.getElementById("linkState").textContent = "—";
  document.getElementById("verdict").textContent = text;
  document.getElementById("hint").textContent = "";
}

async function poll() {
  try {
    const res = await fetch("/api/diagnostics");
    if (res.status === 503) { waiting("El gateway todavía no publicó su primer ciclo."); return; }
    if (!res.ok) { waiting("El gateway respondió con un error: " + res.status); return; }
    paint(await res.json());
  } catch {
    waiting("Sin respuesta del gateway. ¿Sigue corriendo el proceso?");
    document.getElementById("dot").className = "dot bad";
  }
}

document.getElementById("tab-op").onclick = () => showTab(true);
document.getElementById("tab-det").onclick = () => showTab(false);
function showTab(op) {
  document.getElementById("tab-op").classList.toggle("active", op);
  document.getElementById("tab-det").classList.toggle("active", !op);
  document.getElementById("view-op").classList.toggle("hidden", !op);
  document.getElementById("view-det").classList.toggle("hidden", op);
}

poll();
setInterval(poll, 1000);
</script>
</body>
</html>
